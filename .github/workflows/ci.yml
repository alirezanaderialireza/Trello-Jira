name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: trello, POSTGRES_PASSWORD: ci, POSTGRES_DB: trello_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U trello" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      # NOTE: --no-frozen-lockfile (F5c hotfix). The F5c agent added
      # @playwright/test and postgres to apps/web/package.json but the
      # Kiro Web sandbox cannot reach registry.npmjs.org (proxy 403),
      # so pnpm-lock.yaml could not be regenerated before push.
      # STATUS (F1.4.6-web): still --no-frozen-lockfile. The flip back to
      # --frozen-lockfile is intentionally deferred to F1.4.6-LOCAL (it
      # needs a real `pnpm install` + committed pnpm-lock.yaml, which the
      # web sandbox cannot produce). See apps/web/e2e/LOCAL_RUNBOOK.md
      # steps 3 + 9. Tracked in .kiro/steering/phase-1.1-complete.md.
      - run: pnpm install --no-frozen-lockfile
      # Architecture lint — runs first because it's fastest and most likely
      # to catch a layering regression. Phase 0.6 enables boundaries on every
      # `packages/*` and the apps/web client; new violations block CI.
      - name: Architecture lint
        run: pnpm lint
      # Typecheck backend packages
      # apps/web stays excluded for now: the historic 142 tsc errors there
      # are documented as "no regression from base" (PR #43). Driving that
      # count to zero + adding apps/web to this matrix is deferred to
      # F1.4.6-LOCAL (needs `pnpm --filter web typecheck` output, which the
      # web sandbox cannot run). See apps/web/e2e/LOCAL_RUNBOOK.md steps 10-11.
      - run: pnpm turbo typecheck --filter=@repo/db --filter=@repo/domain --filter=@repo/auth --filter=@repo/api --filter=@repo/infrastructure --filter=@repo/ws-server --filter=@repo/outbox-worker
      # Tests — domain + date engine (pre-existing chaos/property tests excluded)
      - name: Domain tests
        run: pnpm --filter @repo/domain test
        env:
          DATABASE_URL: postgresql://trello:ci@localhost:5432/trello_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret
      # Infrastructure tests — F1.2.9 notification text builder (pure unit).
      - name: Infrastructure tests
        run: pnpm --filter @repo/infrastructure test
        env:
          DATABASE_URL: postgresql://trello:ci@localhost:5432/trello_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret
      - name: Date engine tests
        run: pnpm --filter web exec npx vitest run src/lib/date.test.ts
        env:
          DATABASE_URL: postgresql://trello:ci@localhost:5432/trello_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret
      # Production build — restored after PR #41 aligned @trpc/server to v11.
      # Validates that Next.js can compile apps/web end-to-end (server build,
      # static optimisation, route trees) including the workspace packages
      # listed under `transpilePackages` in next.config.mjs.
      - name: Build
        run: pnpm turbo build --filter=web
        env:
          DATABASE_URL: postgresql://trello:ci@localhost:5432/trello_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret
          NEXTAUTH_SECRET: ci-secret-for-build-only
          AUTH_TRUST_HOST: "true"

  # ──────────────────────────────────────────────────────────────────────────
  # E2E — Phase 1.1 smoke flow (added by F5c).
  # ──────────────────────────────────────────────────────────────────────────
  #
  # Runs the Playwright spec at apps/web/e2e/specs/phase-1.1-smoke.spec.ts
  # against a freshly-migrated `trello_e2e` Postgres database. The spec
  # itself drops + recreates the public schema in `beforeAll`, so the
  # Postgres service container only needs to be up — no SQL pre-seeding.
  #
  # Stabilisation policy (per .kiro/steering/phase-1.1-complete.md):
  #   `continue-on-error: true` for the first 5 successful baseline runs
  #   on `main`. After that, flip to strict (block PR merge on failure)
  #   in a follow-up PR. This keeps a flaky first-run from gating
  #   unrelated work while we tune timeouts + selectors.
  #
  # STATUS (F1.4.6-web): selectors have been reconciled against the real
  #   UI (this PR), but the spec is still test.describe.SKIP and
  #   continue-on-error stays TRUE. The flip to `false` (and removing
  #   .skip) is deferred to F1.4.6-LOCAL, only AFTER a local run proves
  #   the 4 cases (desktop+mobile × retry) pass. See
  #   apps/web/e2e/LOCAL_RUNBOOK.md steps 6-9. DO NOT flip from the web
  #   sandbox — it cannot run Playwright to verify.
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: trello, POSTGRES_PASSWORD: ci, POSTGRES_DB: trello_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U trello" --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      # See note in build-and-test above. Same hotfix.
      - run: pnpm install --no-frozen-lockfile
      # Browser binaries — Chromium only (mobile-iphone-se uses the same
      # binary with a viewport override; no separate WebKit install needed
      # for the iPhone SE project per Playwright docs).
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Run the smoke spec. Playwright's webServer block boots the Next dev
      # server with DATABASE_URL pointed at trello_e2e; the seed fixture's
      # defensive guard refuses to start if the URL names the dev DB.
      - name: E2E smoke
        run: pnpm --filter web e2e
        env:
          DATABASE_URL_TEST: postgresql://trello:ci@localhost:5432/trello_e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret
          NEXTAUTH_SECRET: ci-secret-for-e2e-only
          AUTH_TRUST_HOST: "true"
      # Persist the HTML report on failure so we can inspect traces +
      # screenshots + videos without re-running the workflow.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
